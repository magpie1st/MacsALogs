<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="한국어로 나눈 일상대화를 영어 대본으로 다시 쓰고 낭독한 학습 페이지." />
  <title>일상대화 영어 대본 — MacsALogs</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .cm { --s0: #2563eb; --s1: #c2410c; --s2: #15803d; --s0-bg: #eff6ff; --s1-bg: #fff7ed; --s2-bg: #f0fdf4;
      --playing: #fef9c3; --mask: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      .cm { --s0: #60a5fa; --s1: #fb923c; --s2: #4ade80; --s0-bg: #172338; --s1-bg: #2b1d12; --s2-bg: #11261a;
        --playing: #3a3410; --mask: #2a2a2a; }
    }
    .cm-hero { margin: 1.6rem 0 0.8rem; }
    .cm-hero h1 { font-size: 1.5rem; margin: 0 0 0.4rem; }
    .cm-hero p { color: var(--text-muted); font-size: 0.9rem; margin: 0; line-height: 1.7; }
    .cm-hero[hidden] { display: none; }
    .cm-tabs { display: flex; gap: 0.3rem; border-bottom: 1px solid var(--border); margin: 0.6rem 0 1rem; }
    .cm-tabs a { padding: 0.5rem 0.8rem; font-size: 0.9rem; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .cm-tabs a:hover { color: var(--accent); text-decoration: none; }
    .cm-tabs a.on { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
    .cm-tabs a span { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; margin-left: 0.2rem; }
    .cm-list { display: grid; gap: 0.8rem; margin-bottom: 2rem; }
    .cm-item { display: block; border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem;
      color: var(--text); background: var(--surface); }
    .cm-item:hover { border-color: var(--accent); text-decoration: none; }
    .cm-item-date { font-size: 0.75rem; color: var(--text-muted); }
    .cm-item-title { font-size: 1.05rem; font-weight: 700; margin-top: 0.15rem; }
    .cm-item-en { font-size: 0.85rem; color: var(--text-muted); }
    .cm-item-sum { font-size: 0.85rem; line-height: 1.65; margin: 0.45rem 0; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cm-item-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .cm-progress { height: 5px; border-radius: 3px; background: var(--border); margin-top: 0.5rem; overflow: hidden; }
    .cm-progress span { display: block; height: 100%; background: var(--accent); }
    .cm-back { display: inline-block; font-size: 0.82rem; margin: 1rem 0 0.2rem; }
    .cm-turn.flash { background: var(--playing); transition: background 0.4s; }
    .x-go { font-size: 0.8rem; margin-left: 0.2rem; }

    /* 표현 복습 */
    .cm-rv-stats { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 0.6rem; }
    .cm-rv-stats b { color: var(--text); }
    .cm-rv-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.9rem; }
    .cm-rv-bar select { font: inherit; font-size: 0.8rem; padding: 0.35rem 0.5rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface); color: var(--text); max-width: 100%; }
    .cm-flash { border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.5); padding: 1rem 1.1rem 1.1rem;
      background: var(--surface); min-height: 15rem; display: flex; flex-direction: column; }
    .cm-flash.done { align-items: center; justify-content: center; text-align: center; }
    .cm-flash-where { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; color: var(--text-muted); }
    .cm-star { background: none; border: 0; font-size: 1.2rem; cursor: pointer; color: #d97706; padding: 0 0.2rem; }
    .cm-flash-tag { font-size: 0.7rem; color: var(--accent); margin-top: 0.4rem; }
    .cm-flash-front { font-size: 1.3rem; font-weight: 700; line-height: 1.5; margin: 0.5rem 0 0.8rem; }
    .cm-flash-back { font-size: 1.15rem; font-weight: 600; color: var(--accent); line-height: 1.5; }
    .cm-flash-lit { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.2rem; }
    .cm-flash-note { font-size: 0.85rem; line-height: 1.6; margin-top: 0.4rem; }
    .cm-flash-line { font-size: 0.85rem; line-height: 1.6; color: var(--text-muted); margin-top: 0.5rem; font-style: italic; }
    .cm-flash-act { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }
    .cm-flash-grade { display: flex; gap: 0.5rem; margin-top: auto; padding-top: 1rem; }
    .cm-flash-grade .cm-btn { flex: 1; height: 42px; font-size: 0.9rem; }
    .cm-btn--link { display: inline-flex; align-items: center; text-decoration: none; color: var(--text); }
    .cm-btn--link:hover { text-decoration: none; }
    .cm-rv-help { font-size: 0.78rem; line-height: 1.65; color: var(--text-muted); margin: 0.8rem 0 2rem; }

    .cm-ep-head h2 { font-size: 1.25rem; margin: 0.4rem 0 0.2rem; }
    .cm-ep-head .en { color: var(--text-muted); font-size: 0.95rem; }
    .cm-meta { font-size: 0.8rem; color: var(--text-muted); margin: 0.3rem 0 0.8rem; }
    .cm-summary { font-size: 0.92rem; line-height: 1.75; margin: 0 0 0.6rem; }
    .cm-note { font-size: 0.8rem; line-height: 1.65; color: var(--text-muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.8rem; margin: 0 0 1rem; }
    .cm-cast { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 0.6rem; }

    .cm-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 0.55rem 0; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .cm-seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .cm-seg button { font: inherit; font-size: 0.8rem; padding: 0.4rem 0.7rem; border: 0; background: transparent;
      color: var(--text); cursor: pointer; }
    .cm-seg button + button { border-left: 1px solid var(--border); }
    .cm-seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .cm-toc { display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; flex: 1 1 100%; }
    .cm-toc::-webkit-scrollbar { display: none; }
    .cm-toc a { flex: none; font-size: 0.75rem; padding: 0.2rem 0.55rem; border: 1px solid var(--border);
      border-radius: 999px; color: var(--text-muted); white-space: nowrap; }
    .cm-toc a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    .cm-scene { margin: 1.6rem 0 0.4rem; scroll-margin-top: 6.5rem; }
    .cm-scene-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .cm-scene-head h3 { font-size: 1.05rem; margin: 0; }
    .cm-scene-head .en { font-size: 0.85rem; color: var(--text-muted); }
    .cm-scene-play { margin-left: auto; font: inherit; font-size: 0.75rem; padding: 0.2rem 0.6rem; cursor: pointer;
      border: 1px solid var(--border); border-radius: 999px; background: none; color: var(--text-muted); }
    .cm-scene-play:hover { border-color: var(--accent); color: var(--accent); }

    .cm-turn { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; padding: 0.55rem 0.5rem;
      border-radius: var(--radius); margin: 0 -0.5rem; scroll-margin: 7rem 0 9rem; }
    .cm-turn.playing { background: var(--playing); }
    .cm-who { grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding-top: 0.1rem; }
    .cm-chip { font-size: 0.68rem; font-weight: 600; padding: 0.1rem 0.45rem; border-radius: 999px; white-space: nowrap;
      border: 1px solid transparent; }
    .cm-chip.s0 { color: var(--s0); background: var(--s0-bg); }
    .cm-chip.s1 { color: var(--s1); background: var(--s1-bg); }
    .cm-chip.s2 { color: var(--s2); background: var(--s2-bg); }
    .cm-chip.low { border-style: dashed; border-color: currentColor; background: transparent; }
    .cm-play { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: none;
      color: var(--text-muted); cursor: pointer; font-size: 0.7rem; display: grid; place-items: center; padding: 0; }
    .cm-play:hover, .cm-turn.playing .cm-play { border-color: var(--accent); color: var(--accent); }
    .cm-en { font-size: 1rem; line-height: 1.6; }
    .cm-ko { font-size: 0.86rem; line-height: 1.6; color: var(--text-muted); }

    .cm[data-view="en"] .cm-ko { display: none; }
    .cm[data-view="ko"] .cm-en { display: none; }
    .cm[data-view="ko"] .cm-ko { color: var(--text); font-size: 0.95rem; }
    /* 말해 보기: 한국어를 먼저 보고 영어를 말한 뒤 눌러서 확인한다 */
    .cm[data-view="quiz"] .cm-ko { grid-column: 2; grid-row: 1; color: var(--text); font-size: 0.95rem; }
    .cm[data-view="quiz"] .cm-en { grid-column: 2; grid-row: 2; cursor: pointer; border-radius: 4px; color: transparent; background: var(--mask);
      user-select: none; }
    .cm[data-view="quiz"] .cm-en.shown { color: inherit; background: transparent; user-select: auto; }

    .cm-box { margin: 0.7rem 0 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .cm-box > summary { cursor: pointer; padding: 0.5rem 0.8rem; font-size: 0.85rem; font-weight: 600; }
    .cm-box table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .cm-box td { padding: 0.5rem 0.8rem; border-top: 1px solid var(--border); vertical-align: top; line-height: 1.55; }
    .cm-box td:first-child { width: 38%; }
    .cm-box .x-en { font-weight: 600; }
    .cm-box .x-note { color: var(--text-muted); font-size: 0.78rem; margin-top: 0.15rem; }

    .cm-cautions { margin: 2rem 0 1rem; }
    .cm-cautions h3 { font-size: 1.05rem; margin: 0 0 0.3rem; }
    .cm-cautions > p { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 0.6rem; }
    .cm-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.7rem 0.85rem; margin: 0 0 0.6rem; }
    .cm-card .k { font-weight: 700; font-size: 0.95rem; }
    .cm-card .lit { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.2rem; }
    .cm-card .lit s { text-decoration-color: var(--s1); }
    .cm-card .use { font-size: 0.9rem; margin-top: 0.15rem; font-weight: 600; color: var(--accent); }
    .cm-card .why { font-size: 0.82rem; line-height: 1.6; margin-top: 0.3rem; }

    /* 하단 플레이어 */
    .cm-player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg);
      border-top: 1px solid var(--border); padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08); }
    .cm-player[hidden] { display: none; }
    .cm-now { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cm-seek-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
    .cm-time { font-size: 0.7rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .cm-seek { flex: 1; min-width: 0; accent-color: var(--accent); }
    .cm-ctrl { display: flex; align-items: center; justify-content: center; gap: 0.35rem; flex-wrap: wrap; }
    .cm-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text);
      font: inherit; font-size: 0.78rem; min-width: 40px; height: 34px; padding: 0 0.5rem; cursor: pointer; }
    .cm-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cm-btn--play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 50px; }
    .cm-btn--play:hover { color: #fff; background: var(--accent-hover); }
    .cm-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }
    body.has-player .site-footer { margin-bottom: 8rem; }
    @media (max-width: 600px) {
      .cm-hero h1 { font-size: 1.3rem; }
      .cm-btn { min-width: 34px; padding: 0 0.35rem; font-size: 0.72rem; }
      .cm-box td { display: block; width: auto !important; }
      .cm-box td + td { border-top: 0; padding-top: 0; }
    }
  </style>
</head>
<body class="cm">
  <header class="site-header">
    <div class="container">
      <div class="site-brand">
        <h1 class="site-title"><a href="index.html">MacsALogs</a></h1>
        <p class="site-tagline">AI 개발 · 생산성 · 취미 기록</p>
      </div>
      <nav class="site-nav">
        <a href="index.html">홈</a>
        <a href="english.html">영어</a>
        <a href="about.html">소개</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="cm-hero" id="cm-hero">
      <h1>일상대화 영어 대본</h1>
      <p>집에서 한국어로 나눈 대화를 영어로는 어떻게 말할지 대본으로 다시 쓰고, 화자마다 다른 목소리로 읽었습니다.
        회차에 들어가 <strong>말해 보기</strong>로 한국어만 보고 영어로 말해 보고, <strong>표현 복습</strong>에서
        회차마다 골라 둔 표현을 카드로 되풀이합니다.</p>
    </section>
    <div id="cm-app"><div class="empty-state"><p>대본을 불러오는 중…</p></div></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Mac · <a href="https://github.com/magpie1st/MacsALogs" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

  <div class="cm-player" id="cm-player" hidden>
    <div class="container">
      <div class="cm-now" id="cm-now"></div>
      <div class="cm-seek-row">
        <span class="cm-time" id="cm-elapsed">0:00</span>
        <input type="range" class="cm-seek" id="cm-seek" min="0" max="1000" value="0" step="1" aria-label="재생 위치" />
        <span class="cm-time" id="cm-total">0:00</span>
      </div>
      <div class="cm-ctrl">
        <button type="button" class="cm-btn" id="cm-step" aria-pressed="false" title="대사마다 멈춤">한 턴씩</button>
        <button type="button" class="cm-btn" id="cm-prev" title="이전 대사">◀︎</button>
        <button type="button" class="cm-btn cm-btn--play" id="cm-toggle" aria-label="재생">▶︎</button>
        <button type="button" class="cm-btn" id="cm-next" title="다음 대사">▶︎▶︎</button>
        <button type="button" class="cm-btn" id="cm-again" title="이 대사 다시">↺</button>
        <button type="button" class="cm-btn" id="cm-speed" title="재생 속도">1×</button>
        <button type="button" class="cm-btn" id="cm-follow" aria-pressed="true" title="재생 중인 대사로 자동 스크롤">따라가기</button>
      </div>
    </div>
  </div>
