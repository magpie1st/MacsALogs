              "text": "Excuse me."
            },
            {
              "kind": "dialogue",
              "text": "You must be really busy."
            },
            {
              "kind": "dialogue",
              "text": "I'm not, but I'm pretending you're not there,"
            },
            {
              "kind": "dialogue",
              "text": "'cause that's what you told me to do."
            },
            {
              "kind": "dialogue",
              "text": "I'm sorry about what happened at the baseball field yesterday."
            },
            {
              "kind": "dialogue",
              "text": "I won't accept your apology, 'cause you don't mean it."
            },
            {
              "kind": "dialogue",
              "text": "That's that."
            },
            {
              "kind": "dialogue",
              "text": "But do you really not remember me?"
            },
            {
              "kind": "dialogue",
              "text": "I'm not very good at remembering people's faces."
            },
            {
              "kind": "dialogue",
              "text": "You don't know just how much I want to remember."
            },
            {
              "kind": "dialogue",
              "text": "I see."
            },
            {
              "kind": "dialogue",
              "text": "But it looks like you don't even remember what happened yesterday,"
            },
            {
              "kind": "dialogue",
              "text": "that doesn't allow me to put much faith in you."
            },
            {
              "kind": "dialogue",
              "text": "You promised that you'd come with a flower between your teeth, didn't you?"
            }
          ]
        },
        {
          "n": 78,
          "lines": [
            {
              "kind": "dialogue",
              "text": "I see you're contemplating whether I meant it or not. I did."
            },
            {
              "kind": "dialogue",
              "text": "Let's pretend this meeting never happened. A promise is a promise, after all."
            },
            {
              "kind": "dialogue",
              "text": "No!"
            },
            {
              "kind": "dialogue",
              "text": "I wasn't sure."
            },
            {
              "kind": "dialogue",
              "text": "So... I did... prepare it..."
            },
            {
              "kind": "dialogue",
              "text": "By any chance, if you're doing this because of my attitude yesterday-"
            },
            {
              "kind": "dialogue",
              "text": "Enough with the explanations. Do what you promised to do,"
            },
            {
              "kind": "dialogue",
              "text": "if you don't want to"
            },
            {
              "kind": "dialogue",
              "text": "I'm really sorry!"
            },
            {
              "kind": "dialogue",
              "text": "But are you against me putting it behind my ears?"
            },
            {
              "kind": "dialogue",
              "text": "Well, I'll be able to endure it."
            },
            {
              "kind": "dialogue",
              "text": "Put it behind your ears and wait. I was in the middle of something."
            }
          ]
        },
        {
          "n": 79,
          "lines": [
            {
              "kind": "dialogue",
              "text": "That's not the right thing to do."
            }
          ]
        },
        {
          "n": 80,
          "lines": [
            {
              "kind": "dialogue",
              "text": "I don't have any time today. Let's talk next time."
            },
            {
              "kind": "dialogue",
              "text": "Wait. It'll only take five minutes."
            },
            {
              "kind": "dialogue",
              "text": "I apologize for my behavior yesterday at the baseball field."
            },
            {
              "kind": "dialogue",
              "text": "Since I've received my punishment like this,"
            },
            {
              "kind": "dialogue",
              "text": "please, don't be angry anymore."
            },
            {
              "kind": "dialogue",
              "text": "And please excuse the behavior of my kids."
            },
            {
              "kind": "dialogue",
              "text": "They're still students who need guidance."
            },
            {
              "kind": "dialogue",
              "text": "They didn't seem to be weak enough to need guidance."
            },
            {
              "kind": "dialogue",
              "text": "They're young enough to need guidance."
            },
            {
              "kind": "dialogue",
              "text": "Sorry, but I have no interest in those kids' lives."
            },
            {
              "kind": "dialogue",
              "text": "There will be no settlement."
            },
            {
              "kind": "dialogue",
              "text": "Excuse-"
            },
            {
              "kind": "dialogue",
              "text": "Excuse..."
            },
            {
              "kind": "dialogue",
              "text": "Wait!"
            },
            {
              "kind": "dialogue",
              "text": "Director Kim, wait!"
            }
          ]
        },
        {
          "n": 81,
          "lines": [
            {
              "kind": "dialogue",
              "text": "Let me just ask you one thing."
            },
            {
              "kind": "dialogue",
              "text": "Please, ask."
            },
            {
              "kind": "dialogue",
              "text": "You like Tae San, right?"
            },
            {
              "kind": "dialogue",
              "text": "Excuse me?"
            },
            {
              "kind": "dialogue",
              "text": "Just you."
            },
            {
              "kind": "dialogue",
              "text": "What you'd call a one-sided love,"
            },
            {
              "kind": "dialogue",
              "text": "with your friend's boyfriend."
            }
          ]
        },
        {
          "n": 82,
          "lines": [
            {
              "kind": "narration",
              "text": "Do you really not know me?"
            },
            {
              "kind": "narration",
              "text": "To think that man is that man."
            },
            {
              "kind": "narration",
              "text": "What do I do, what do I do, what do I do?"
            },
            {
              "kind": "narration",
              "text": "Men are lined up offering me diamonds, imported cars, and keys to officetels."
            },
            {
              "kind": "dialogue",
              "text": "Are there three of them? Or is one offering you all three?"
            },
            {
              "kind": "narration",
              "text": "If he gets caught this time, he'll get divorced immediately!"
            },
            {
              "kind": "narration",
              "text": "I forgot to tell you that I paid for the tab."
            },
            {
              "kind": "dialogue",
              "text": "And since I'm already spending, I splurged a bit more."
            },
            {
              "kind": "narration",
              "text": "You might as well have as much fun as you can."
            },
            {
              "kind": "narration",
              "text": "You took my pen, didn't you?"
            },
            {
              "kind": "narration",
              "text": "Pen? Why would I have taken that?"
            },
            {
              "kind": "narration",
              "text": "It's important to me!"
            },
            {
              "kind": "narration",
              "text": "She's grown up to be quite pretty."
            },
            {
              "kind": "narration",
              "text": "In my opinion, you're still someone's first love."
            },
            {
              "kind": "narration",
              "text": "I've been dragged around enough by you."
            },
            {
              "kind": "narration",
              "text": "Is this how I'm supposed to be punished for not remembering you?"
            },
            {
              "kind": "dialogue",
              "text": "This is the only way to punish you."
            },
            {
              "kind": "dialogue",
              "text": "I fell for you at first sight."
            }
          ]
        }
      ]
    }
  ]
