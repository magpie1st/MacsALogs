<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="미드·한드 영어 스크립트를 작품·시즌·회차별로 읽는 개인 학습용 페이지. 문장 동기화 재생, 한국어 자막, 본문 검색, 글자 크기 조절을 지원합니다." />
  <title>드라마 스크립트 리더 — Lang-Studio</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../assets/ls.css" />
  <script src="../assets/ls.js"></script>
</head>
<body>
  <a class="skip-link" href="#tv-script">본문 바로가기</a>

  <header id="ls-header" data-page="drama"></header>

  <main class="container">
    <section class="tv-hero">
      <p class="tv-eyebrow">TV Show Script</p>
      <h1 id="tv-series" tabindex="-1">TV Show Script</h1>
      <!-- 작품 종류에 따라 설명이 달라지므로 본문은 tvshow.js 가 채운다 (TTS 낭독 / 실제 방송 녹음) -->
      <p class="tv-hero-sub" id="tv-hero-sub">
        <strong id="tv-series-ko"></strong>
      </p>
      <div class="tv-stats" id="tv-stats"></div>
    </section>

    <section class="tv-toolbar" aria-label="스크립트 읽기 도구">
      <div class="tv-field">
        <label class="tv-label" for="tv-show">작품</label>
        <select class="tv-select" id="tv-show"></select>
      </div>

      <!-- 시즌이 하나뿐인 작품에서는 숨긴다 -->
      <div class="tv-field" id="tv-season-field" hidden>
        <label class="tv-label" for="tv-season">시즌</label>
        <select class="tv-select" id="tv-season"></select>
      </div>

      <div class="tv-field tv-field--episode">
        <label class="tv-label" for="tv-episode">에피소드</label>
        <select class="tv-select" id="tv-episode"></select>
        <!-- 아래 플레이어의 '문장' 이동과 헷갈리지 않도록, 여기서는 '에피소드'를 끝까지 적는다 -->
        <div class="tv-epnav" role="group" aria-label="에피소드 이동">
          <button type="button" class="tv-btn tv-btn--ep" id="tv-ep-prev"
                  aria-label="이전 에피소드로 이동" title="이전 에피소드 ( [ )">◀ 이전 에피소드</button>
          <button type="button" class="tv-btn tv-btn--ep" id="tv-ep-next"
                  aria-label="다음 에피소드로 이동" title="다음 에피소드 ( ] )">다음 에피소드 ▶</button>
        </div>
        <p class="tv-epnav-status" id="tv-ep-status" role="status" aria-live="polite"></p>
      </div>

      <div class="tv-field tv-field--grow">
        <label class="tv-label" for="tv-search">본문 검색</label>
        <div class="tv-search-row">
          <input class="tv-search" id="tv-search" type="search" autocomplete="off"
                 placeholder="영어 단어나 문장 입력 (Enter: 다음 결과)"
                 aria-describedby="tv-search-count" />
          <button type="button" class="tv-btn" id="tv-search-prev" aria-label="이전 검색 결과" title="이전 결과 (Shift+Enter)" disabled>↑</button>
          <button type="button" class="tv-btn" id="tv-search-next" aria-label="다음 검색 결과" title="다음 결과 (Enter)" disabled>↓</button>
        </div>
        <p class="tv-search-count" id="tv-search-count" role="status" aria-live="polite"></p>
      </div>

      <!-- 한국어 자막이 있는 작품(lang-study 녹음)에서만 나타난다 -->
      <div class="tv-field" id="tv-ko-field" hidden>
        <span class="tv-label" id="tv-ko-label">한국어</span>
        <div class="tv-font-group" role="group" aria-labelledby="tv-ko-label">
          <button type="button" class="tv-btn tv-btn--text" id="tv-ko-toggle" aria-pressed="true"
                  title="한국어 자막 보이기/숨기기 ( K )">한국어 숨기기</button>
        </div>
      </div>

      <div class="tv-field">
        <span class="tv-label" id="tv-font-label">글자 크기</span>
        <div class="tv-font-group" role="group" aria-labelledby="tv-font-label">
          <button type="button" class="tv-btn" id="tv-font-down" aria-label="글자 작게" title="글자 작게">A−</button>
          <span class="tv-font-value" id="tv-font-value" aria-live="polite">100%</span>
          <button type="button" class="tv-btn" id="tv-font-up" aria-label="글자 크게" title="글자 크게">A+</button>
          <button type="button" class="tv-btn tv-btn--text" id="tv-font-reset">기본</button>
        </div>
      </div>
    </section>


    <article class="tv-script" id="tv-script" tabindex="-1" aria-labelledby="tv-episode-title">
      <div class="empty-state"><p>스크립트를 불러오는 중…</p></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Mac · <a href="https://github.com/magpie1st/MacsALogs" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

  <button type="button" class="tv-top" id="tv-top" hidden>
    <span aria-hidden="true">↑</span> 맨 위로
  </button>

  <!-- 오디오가 있는 회차에서만 나타난다. 없는 회차는 기존 스크립트 화면 그대로다. -->
  <section class="tv-player" id="tv-player" aria-label="문장 동기화 오디오 플레이어" hidden>
    <div class="container">
      <p class="tv-player-now" id="tv-player-now" aria-live="polite">—</p>

      <div class="tv-seek-row">
        <span class="tv-time" id="tv-time-now">0:00</span>
        <input class="tv-seek" id="tv-seek" type="range" min="0" max="100" step="0.1" value="0"
               aria-label="재생 위치" />
        <span class="tv-time" id="tv-time-total">0:00</span>
        <!-- 이 회차를 듣던 자리가 기억돼 있으면 나타난다 (audiobook 의 이어듣기와 같다) -->
        <span id="tv-resume-bar" hidden><button type="button" class="tv-chip" id="tv-resume">↩ 이어듣기</button></span>
      </div>

      <!-- audiobook.html 과 같은 짜임새: 아이콘 한 줄. 글자 버튼은 토글(aria-pressed)이다.
           예전에는 글자 버튼이 넓어 휴대폰에서 두세 줄로 접혀 바가 화면의 1/4을 먹었다. -->
      <div class="tv-ctl" role="group" aria-label="재생 조작">
        <button type="button" class="tv-ico" id="tv-seg-prev" title="이전 문장 ( A )" aria-label="이전 문장"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M11.5 6v12L3 12z"/><path d="M21 6v12l-8.5-6z"/></svg></button>
        <button type="button" class="tv-ico tv-ico--play" id="tv-play" title="재생 / 일시정지 ( Space )" aria-label="재생">▶</button>
        <button type="button" class="tv-ico" id="tv-seg-next" title="다음 문장 ( D )" aria-label="다음 문장"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M12.5 6v12L21 12z"/><path d="M3 6v12l8.5-6z"/></svg></button>

        <span class="tv-sep" aria-hidden="true"></span>

        <button type="button" class="tv-ico" id="tv-repeat-once" title="이 문장 다시 한 번" aria-label="이 문장 다시 듣기"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><polyline points="20 4 20 9 15 9"/></svg></button>
        <button type="button" class="tv-ico tv-ico--letter" id="tv-repeat" aria-pressed="false"
                title="문장 반복 — 끌 때까지 이 문장만 ( R )" aria-label="문장 반복">R</button>
        <button type="button" class="tv-ico tv-ico--letter" id="tv-follow" aria-pressed="true"
                title="따라가기 — 재생 위치로 본문 스크롤 ( F )" aria-label="따라가기">F</button>
        <button type="button" class="tv-ico tv-ico--letter" id="tv-ko-bar" aria-pressed="true"
                title="한국어 자막 보이기/숨기기 ( K )" aria-label="한국어 자막" hidden>한</button>


        <select class="tv-rate-select" id="tv-rate" title="재생 속도" aria-label="재생 속도">
          <option value="0.75">0.75×</option>
          <option value="0.9">0.9×</option>
          <option value="1" selected>1×</option>
          <option value="1.15">1.15×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>

      <audio id="tv-audio" preload="metadata"></audio>
    </div>
  </section>
