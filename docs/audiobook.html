<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex" />
  <title>Audiobook — MacsALogs</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 오디오북 전용. 나머지는 tvshow 의 .tv-* 스타일을 그대로 쓴다. */
    [hidden] { display: none !important; }   /* .tv-toolbar·.tv-btn 의 display 가 hidden 을 이기지 않게 */
    .ab-para {
      font-size: calc(1.02rem * var(--tv-font-scale));
      line-height: 1.85; margin: 0 0 0.9rem; text-indent: 1.2em;
    }
    .ab-para--first, .ab-para--verse, .ab-para--attribution, .ab-para--title { text-indent: 0; }
    .ab-para--verse { font-style: italic; margin: 0 0 0.25rem 1.5rem; color: var(--text-muted); }
    .ab-para--attribution { font-size: calc(0.85rem * var(--tv-font-scale)); color: var(--text-muted);
                            margin: 0.4rem 0 1.6rem 1.5rem; }
    .ab-para--title { font-weight: 700; font-style: italic; margin-top: 1.4rem; }
    .ab-para em { font-style: italic; }
    .ab-para--verse em { font-style: normal; }

    .ab-toc { list-style: none; padding: 0; margin: 1rem 0 0; border-top: 1px solid var(--border); }
    .ab-toc li { border-bottom: 1px solid var(--border); }
    .ab-toc a {
      display: flex; align-items: baseline; gap: 0.75rem;
      padding: 0.7rem 0.25rem; color: var(--text); text-decoration: none;
    }
    .ab-toc a:hover { color: var(--accent); background: var(--surface); }
    .ab-toc-title { flex: 1; font-weight: 600; }
    .ab-toc-meta { font-size: 0.75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .ab-toc-resume { font-size: 0.72rem; color: var(--accent); white-space: nowrap; }
    .ab-toc-pending { font-size: 0.72rem; color: var(--text-muted); border: 1px dashed var(--border);
                      border-radius: 999px; padding: 0 0.5rem; }
    .ab-epigraph { margin: 1.5rem 0 0.5rem; padding: 1rem 1.25rem; background: var(--surface);
                   border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; }
    .ab-epigraph p { margin: 0; line-height: 1.7; }
    .ab-epigraph .ab-epi-attr { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem; }
    .ab-lock { max-width: 26rem; margin: 1rem auto 3rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .ab-lock-row { display: flex; gap: 0.4rem; }
    .ab-lock-remember { align-self: flex-start; }
    /* 책갈피 */
    .ab-para { position: relative; border-radius: 4px; transition: background 0.4s; }
    .ab-ribbon { display: none; position: absolute; top: -0.35rem; right: -0.2rem; border: 0; background: none;
                 cursor: pointer; font-size: 1rem; line-height: 1; padding: 0.2rem; text-indent: 0; font-style: normal; }
    .ab-para.has-mark { box-shadow: inset 3px 0 0 var(--accent); padding-left: 0.7rem; padding-right: 1.6rem; }
    .ab-para.has-mark .ab-ribbon { display: block; }
    .ab-para.is-last { background: linear-gradient(to right, var(--tag-bg), transparent 70%); }
    .ab-para.is-last::before { content: '📖 읽던 곳'; display: block; font-size: 0.7rem; color: var(--accent);
                               text-indent: 0; font-style: normal; font-weight: 600; }
    .ab-para.is-flash { background: var(--tag-bg); }
    .ab-last-row { margin-top: 0.6rem; }
    .ab-last-link { margin: 1rem 0 0.3rem; font-size: 0.9rem; }
    .ab-marks-head { font-size: 0.95rem; margin: 1.2rem 0 0.3rem; }
    .ab-marks { list-style: none; padding: 0; margin: 0 0 0.5rem; }
    .ab-marks li { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; border-bottom: 1px dashed var(--border); }
    .ab-marks a { flex: 1; color: var(--text); text-decoration: none; font-size: 0.88rem; }
    .ab-marks a:hover { color: var(--accent); }
    /* ── 얇은 플레이어 ── */
    .ab-player { padding: 0.3rem 0 calc(0.35rem + env(safe-area-inset-bottom)); }
    .ab-now { font-size: 0.72rem; color: var(--accent); text-align: center; margin: 0 0 0.15rem;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ab-now:empty { display: none; }
    .ab-seek-row { display: flex; align-items: center; gap: 0.45rem; }
    .ab-seek { flex: 1; min-width: 0; height: 4px; margin: 0; }
    .ab-chip { font-size: 0.68rem; padding: 0.05rem 0.45rem; border: 1px solid var(--accent); color: var(--accent);
               background: var(--bg); border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .ab-controls { display: flex; align-items: center; justify-content: center; gap: 0.15rem; margin-top: 0.2rem;
                   flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .ab-controls::-webkit-scrollbar { display: none; }
    .ab-ico { flex: 0 0 auto; width: 34px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: none;
              color: var(--text); display: inline-flex; align-items: center; justify-content: center;
              cursor: pointer; font-size: 1rem; line-height: 1; }
    .ab-ico:hover { background: var(--tag-bg); color: var(--accent); }
    .ab-ico:focus-visible, .ab-rate:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ab-ico:disabled { opacity: 0.35; cursor: default; }
    .ab-play { width: 40px; height: 34px; background: var(--accent); color: #fff; border-radius: 999px; font-size: 0.95rem; }
    .ab-play:hover { background: var(--accent-hover); color: #fff; }
    .ab-letter { font-size: 0.8rem; font-weight: 700; width: 28px; height: 26px; border: 1px solid var(--border); border-radius: 6px; }
    .ab-letter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ab-sep { flex: 0 0 auto; width: 1px; height: 18px; background: var(--border); margin: 0 0.15rem; }
    .ab-rate { flex: 0 0 auto; height: 26px; font-size: 0.75rem; border: 1px solid var(--border); border-radius: 6px;
               background: var(--bg); color: var(--text); padding: 0 0.15rem; margin-left: 0.1rem; cursor: pointer; width: 3.4rem; }
    /* tvshow 용 여백(11rem)보다 얇게 */
    body.has-tv-player .site-footer { margin-bottom: 5.5rem; }
    body.has-tv-player .tv-top { bottom: calc(6rem + env(safe-area-inset-bottom)); }
    body.has-tv-player { scroll-padding-bottom: 6rem; }
    @media (max-width: 440px) { .ab-controls { gap: 0.05rem; } .ab-ico { width: 28px; } .ab-letter { width: 24px; }
                                .ab-play { width: 38px; } .ab-sep { display: none; } .ab-rate { width: 3.1rem; } }
    .tv-btn.is-on { background: var(--tag-bg); border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <a class="skip-link" href="#tv-script">본문 바로가기</a>

  <header class="site-header">
    <div class="container">
      <div class="site-brand">
        <h1 class="site-title"><a href="index.html">MacsALogs</a></h1>
        <p class="site-tagline">AI 개발 · 생산성 · 취미 기록</p>
      </div>
      <nav class="site-nav">
        <a href="index.html">홈</a>
        <a href="english.html">영어</a>
        <a href="about.html">소개</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="tv-hero">
      <p class="tv-eyebrow">Audiobook</p>
      <h1 id="ab-book-title" tabindex="-1">Audiobook</h1>
      <p class="tv-hero-sub" id="ab-book-sub"></p>
      <div class="tv-stats" id="ab-stats"></div>
    </section>

    <section class="tv-toolbar" aria-label="오디오북 도구">
      <div class="tv-field" id="ab-book-field">
        <label class="tv-label" for="ab-book">책</label>
        <select class="tv-select" id="ab-book"></select>
      </div>

      <div class="tv-field tv-field--episode">
        <label class="tv-label" for="ab-chapter">챕터</label>
        <select class="tv-select" id="ab-chapter"></select>
        <!-- 아래 플레이어의 '문장' 이동과 헷갈리지 않도록 '챕터'를 끝까지 적는다 -->
        <div class="tv-epnav" role="group" aria-label="챕터 이동">
          <button type="button" class="tv-btn tv-btn--ep" id="ab-ch-prev" title="이전 챕터 ( [ )">◀ 이전 챕터</button>
          <button type="button" class="tv-btn tv-btn--ep" id="ab-ch-next" title="다음 챕터 ( ] )">다음 챕터 ▶</button>
        </div>
      </div>

      <div class="tv-field">
        <span class="tv-label" id="ab-font-label">글자 크기</span>
        <div class="tv-font-group" role="group" aria-labelledby="ab-font-label">
          <button type="button" class="tv-btn" id="ab-font-down" aria-label="글자 작게">A−</button>
          <span class="tv-font-value" id="ab-font-value" aria-live="polite">100%</span>
          <button type="button" class="tv-btn" id="ab-font-up" aria-label="글자 크게">A+</button>
          <button type="button" class="tv-btn tv-btn--text" id="ab-font-reset">기본</button>
        </div>
      </div>

      <!-- 암호화 페이지에서 연 뒤에만 보인다. 이 기기에 기억한 암호를 지우고 다시 잠근다 -->
      <div class="tv-field">
        <span class="tv-label">&nbsp;</span>
        <button type="button" class="tv-btn tv-btn--text" id="ab-lock" hidden title="기억한 암호를 지우고 잠급니다">🔒 잠그기</button>
      </div>

      <!-- 챕터에 낭독이 둘 이상 있을 때만 보인다. 고른 값은 이 기기에 기억한다 -->
      <div class="tv-field" id="ab-engine-wrap" hidden>
        <label class="tv-label" for="ab-engine">낭독</label>
        <select class="tv-select" id="ab-engine"></select>
      </div>

      <div class="tv-field">
        <span class="tv-label">이어 재생</span>
        <label class="tv-follow" title="챕터가 끝나면 다음 챕터를 이어서 재생합니다">
          <input type="checkbox" id="ab-autonext" checked /> 다음 챕터 자동
        </label>
      </div>

      <!-- 지금 읽는 문단에 책갈피를 꽂거나 뺀다 ( B ). 읽던 곳은 따로 자동으로 기억한다 -->
      <div class="tv-field">
        <span class="tv-label">책갈피</span>
        <button type="button" class="tv-btn tv-btn--text" id="ab-bookmark" title="지금 읽는 문단에 책갈피 ( B )">🔖 책갈피</button>
        <p class="tv-search-count" id="ab-mark-status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <article class="tv-script" id="tv-script" tabindex="-1">
      <div class="empty-state"><p>불러오는 중…</p></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container"><p>© 2026 Mac · 개인 학습용</p></div>
  </footer>

  <button type="button" class="tv-top" id="ab-top" hidden><span aria-hidden="true">↑</span> 맨 위로</button>

  <!-- 오디오가 있는 챕터에서만 나타난다. 목차와 음원 없는 챕터에서는 숨는다. -->
  <!-- 오디오가 있는 챕터에서만 나타난다. 얇게: 시간·진행 막대 한 줄 + 아이콘 버튼 한 줄 -->
  <section class="tv-player ab-player" id="ab-player" aria-label="문장 동기화 오디오 플레이어" hidden>
    <div class="container">
      <!-- 상태 메시지(음원 푸는 중, 오류)만 잠깐 보인다. 비어 있으면 줄이 사라진다 -->
      <p class="ab-now" id="ab-now" aria-live="polite"></p>
      <div class="ab-seek-row">
        <span class="tv-time" id="ab-time-now">0:00</span>
        <input class="tv-seek ab-seek" id="ab-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="재생 위치" />
        <span class="tv-time" id="ab-time-total">0:00</span>
        <span id="ab-resume-bar" hidden><button type="button" class="ab-chip" id="ab-resume">↩ 이어듣기</button></span>
      </div>
      <div class="ab-controls" role="group" aria-label="재생 조작">
        <button type="button" class="ab-ico" id="ab-seg-prev" title="이전 문장 ( ← )" aria-label="이전 문장"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M11.5 6v12L3 12z"/><path d="M21 6v12l-8.5-6z"/></svg></button>
        <button type="button" class="ab-ico ab-play" id="ab-play" title="재생 / 일시정지 ( Space )" aria-label="재생">▶</button>
        <button type="button" class="ab-ico" id="ab-seg-next" title="다음 문장 ( → )" aria-label="다음 문장"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M12.5 6v12L21 12z"/><path d="M3 6v12l8.5-6z"/></svg></button>
        <span class="ab-sep" aria-hidden="true"></span>
        <button type="button" class="ab-ico" id="ab-repeat" title="이 문장 다시 한 번 ( A )" aria-label="이 문장 다시 듣기"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><polyline points="20 4 20 9 15 9"/></svg></button>
        <button type="button" class="ab-ico ab-letter" id="ab-loop" aria-pressed="false" title="문장 반복 — 끌 때까지 이 문장만 ( R )" aria-label="문장 반복">R</button>
        <button type="button" class="ab-ico ab-letter" id="ab-stepmode" aria-pressed="false" title="문장마다 멈춤 — 따라 말하기용 ( S )" aria-label="문장마다 멈춤">S</button>
        <button type="button" class="ab-ico ab-letter" id="ab-follow" aria-pressed="true" title="따라가기 — 낭독 위치로 본문 스크롤 ( F )" aria-label="따라가기">F</button>
        <button type="button" class="ab-ico" id="ab-bookmark-bar" title="지금 낭독 중인 문단에 책갈피 ( B )" aria-label="책갈피"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
        <select class="ab-rate" id="ab-rate" title="재생 속도" aria-label="재생 속도">
          <option value="0.75">0.75×</option>
          <option value="0.9">0.9×</option>
          <option value="1" selected>1×</option>
          <option value="1.15">1.15×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
      <audio id="ab-audio" preload="metadata"></audio>
    </div>
  </section>
