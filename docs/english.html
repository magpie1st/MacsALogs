<style>

.seg { display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; }

.card { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:14px 16px;

  font-size:1.5rem; color:var(--muted); opacity:.5; cursor:pointer; }
.star.on { color:var(--star); opacity:1; }
.ans { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.card.hide .ans { display:none; }
.en { font-weight:700; color:var(--accent); background:var(--accent-bg); padding:2px 8px; border-radius:6px;

.ex { margin-top:6px; }
.exko, .note { color:var(--muted); font-size:.88rem; margin-top:4px; }
.say { border:0; background:transparent; cursor:pointer; font-size:1rem; padding:2px 6px; opacity:.7; }
.hint { color:var(--muted); font-size:.82rem; margin-top:8px; }
.card:not(.hide) .hint { display:none; }
.pager { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--border);

y.", "note": "2026-07-21. `when it comes to`와 함께 쓰기 좋음."}, {"n": 12, "ko": "바로 그래서 우리는 서로 균형을 맞춰줘요.", "en": "balance each other out", "ex": "That is exactly why we balance each other out.", "note": "2026-07-21. 서로 다른 성향이 장점이 되는 상황."}, {"n": 13, "ko": "저는 일과 병행하면서 꾸준히 공부하려고 노력해 왔어요.", "en": "while balancing work", "ex": "I have been trying to study consistently while balancing work.", "note": "2026-07-22. 원문 `well balancing work`→`while balancing work`."}, {"n": 14, "ko": "매일 영어에 노출되는 것만으로도 더 빠져들고 자신감이 올라갔어요.", "en": "being exposed to English every day", "ex": "Just being exposed to English every day has helped me get into it more and boosted my confidence.", "note": "2026-07-22. `everyday`→`every day`, `booted`→`boosted`."}, {"n": 15, "ko": "그게 제가 계속 공부할 동기를 유지하게 해줘요.", "en": "keeps me motivated", "ex": "That's what keeps me motivated to keep studying.", "note": "2026-07-22. 루틴 유지 이유를 말할 때 좋은 문장."}, {"n": 16, "ko": "흥미로운 아이디어가 떠오를 때마다 계속 글을 쓰고 공유할 계획이에요.", "en": "comes to mind", "ex": "Whenever an interesting idea comes to mind, I plan to keep writing and sharing my stories.", "note": "2026-07-22. 아이디어 기록·글쓰기 루틴과 연결하기 좋음."}, {"n": 17, "ko": "증상이 전혀 없어서 건강검진이 아니었다면 발견 못했을 거예요.", "en": "if it hadn't been for", "ex": "I didn't have any symptoms, so if it hadn't been for the health screening, I probably never would've found it.", "note": "2026-07-23. 건강검진의 중요성을 말하는 가정법 문장."}, {"n": 18, "ko": "건강은 당연하게 여길 것이 아니라는 걸 깨달았어요.", "en": "take for granted", "ex": "It reminded me that health is not something we should take for granted.", "note": "2026-07-23. 교훈·깨달음을 말할 때 재사용 가능."}, {"n": 19, "ko": "모두 정기 검진을 꾸준히 받고 건강하길 바라요.", "en": "keep up with regular checkups", "ex": "I hope everyone keeps up with regular checkups and stays healthy.", "note": "2026-07-23. 마무리 권유 문장."}, {"n": 20, "ko": "곧 땀이 엄청나게 났다.", "en": "sweating buckets", "ex": "I was soon sweating buckets.", "note": "레거시 원본 No.138."}, {"n": 21, "ko": "너무 힘들어 주저앉고 말았다.", "en": "sank to the ground exhausted", "ex": "I sank to the ground exhausted.", "note": "레거시 원본 No.139."}, {"n": 22, "ko": "급여가 높은 편이 아니에요.", "en": "doesn't pay very much", "ex": "It doesn't pay very much.", "note": "레거시 원본 No.140."}, {"n": 23, "ko": "그는 새벽에 출근했다.", "en": "set out for work", "ex": "He would set out for work early in the morning.", "note": "레거시 원본 No.141."}, {"n": 24, "ko": "꼭대기 층에서 보이는 전망이 장관이다.", "en": "a sight to behold", "ex": "The view from the top floor is a sight to behold.", "note": "레거시 원본 No.142."}, {"n": 25, "ko": "경쟁이 치열해요.", "en": "competition is intense", "ex": "The competition is intense.", "note": "레거시 원본 No.143."}, {"n": 26, "ko": "우린 토요일에 함께 할 활동을 하기로 했다.", "en": "made it a rule to", "ex": "We've made it a rule to do things together every Saturday.", "note": "레거시 원본 No.144."}, {"n": 27, "ko": "난 상쾌한 바람을 쐬려고 밖에 나갔다.", "en": "get some fresh air", "ex": "I went outside to get some fresh air.", "note": "레거시 원본 No.145."}, {"n": 28, "ko": "이제 1년 정도만 더 참으면 돼요.", "en": "ride it out", "ex": "We just need to ride it out for about one more year.", "note": "레거시 원본 No.146."}, {"n": 29, "ko": "내가 딱 그렇다.", "en": "describes me to a T", "ex": "That describes me to a T.", "note": "레거시 원본 No.147."}, {"n": 30, "ko": "그건 때때로 나를 불안하게 한다.", "en": "makes me feel uneasy", "ex": "It sometimes makes me feel uneasy.", "note": "레거시 원본 No.148."}, {"n": 31, "ko": "그들에게 설득당하지 마.", "en": "talk you into it", "ex": "Don't let them talk you into it.", "note": "레거시 원본 No.149."}, {"n": 32, "ko": "그때 봐서 정하다, 상황 보고 정하다", "en": "play it by ear", "ex": "Let's play it by ear and text each other in the morning.", "note": "캐주얼·비즈니스 공용."}, {"n": 33, "ko": "어떻게 되나 보다", "en": "see how it goes", "ex": "Let's see how it goes.", "note": ""}, {"n": 34, "ko": "진행하면서 정하다", "en": "figure it out as we go", "ex": "We'll figure it out as we go.", "note": ""}, {"n": 35, "ko": "그때 가서 판단하다 (포멀)", "en": "assess the situation closer to the time", "ex": "Let's assess the situation closer to the time.", "note": "유사표현: We can remain flexible on th luggish whenever it installs updates.", "exko": "내 노트북은 업데이트를 설치할 때마다 굼떠진다."}, {"n": 178, "ko": "규정 준수", "en": "compliance", "ipa": "/kəmˈplaɪəns/", "ex": "Changing the kernel could break our compliance with Google's rules.", "exko": "커널을 바꾸면 구글 규정 준수에 어긋날 수 있다."}, {"n": 179, "ko": "논란이 많은", "en": "controversial", "ipa": "/ˌkɑːntrəˈvɜːrʃəl/", "ex": "Calling it a space rather than a product is a bit controversial.", "exko": "제품이 아니라 영역이라 부르는 것은 약간 논란의 여지가 있다."}, {"n": 180, "ko": "의존성, 의존 관계", "en": "dependency", "ipa": "/dɪˈpendənsi/", "ex": "The schedule has a heavy dependency on the supplier.", "exko": "일정은 공급업체에 크게 의존한다."}, {"n": 181, "ko": "멈추다; 지연시키다", "en": "stall", "ipa": "/stɔːl/", "ex": "Don't stall the project while waiting for approval.", "exko": "승인을 기다리며 프로젝트를 멈춰 세우지 마세요."}, {"n": 182, "ko": "지연 시간", "en": "latency", "ipa": "/ˈleɪtənsi/", "ex": "Parking commands need very low latency.", "exko": "주차 명령은 지연 시간이 아주 짧아야 한다."}, {"n": 183, "ko": "발화, 한 번 하는 말", "en": "utterance", "ipa": "/ˈʌtərəns/", "ex": "The system handles each user utterance in under a second.", "exko": "시스템은 사용자의 발화를 하나당 1초 안에 처리한다."}, {"n": 184, "ko": "확장 가능한", "en": "scalable", "ipa": "/ˈskeɪləbl/", "ex": "We need a scalable architecture that can serve millions of users.", "exko": "수백만 사용자를 감당할 수 있는 확장 가능한 구조가 필요하다."}, {"n": 185, "ko": "실행 가능한, 사업성 있는", "en": "viable", "ipa": "/ˈvaɪəbl/", "ex": "Is this a commercially viable product?", "exko": "이것이 사업성이 있는 제품인가?"}, {"n": 186, "ko": "엄두를 못 낼 만큼 높은", "en": "prohibitive", "ipa": "/proʊˈhɪbɪtɪv/", "ex": "The cost of running a large model for every user is prohibitive.", "exko": "모든 사용자에게 큰 모델을 돌리는 비용은 엄두를 못 낼 만큼 높다."}, {"n": 187, "ko": "증류하다; 핵심만 추려 작게 만들다", "en": "distill", "ipa": "/dɪˈstɪl/", "ex": "They want to distill a large model into a smaller one.", "exko": "그들은 큰 모델을 작은 모델로 증류하고 싶어 한다."}, {"n": 188, "ko": "실현 가능성", "en": "feasibility", "ipa": "/ˌfiːzəˈbɪləti/", "ex": "We ran a quick feasibility study before starting the PoC.", "exko": "우리는 PoC를 시작하기 전에 간단한 타당성 조사를 했다."}, {"n": 189, "ko": "잘 받아들이는", "en": "receptive", "ipa": "/rɪˈseptɪv/", "ex": "The business unit was not receptive to the new proposal.", "exko": "사업부는 새 제안을 잘 받아들이지 않았다."}, {"n": 190, "ko": "산출물, 납품물", "en": "deliverable", "ipa": "/dɪˈlɪvərəbl/", "ex": "Please list the deliverables for each milestone.", "exko": "마일스톤마다 산출물을 정리해 주세요."}, {"n": 191, "ko": "차별화, 차이", "en": "differentiation", "ipa": "/ˌdɪfəˌrenʃiˈeɪʃən/", "ex": "What is our differentiation from other suppliers?", "exko": "다른 공급업체와 우리의 차별점은 무엇인가?"}, {"n": 192, "ko": "실패할 수밖에 없는", "en": "doomed", "ipa": "/duːmd/", "ex": "Without leadership support, the initiative is doomed.", "exko": "경영진의 지원이 없으면 그 사업은 실패할 수밖에 없다."}, {"n": 193, "ko": "불분명한; 잘 알려지지 않은", "en": "obscure", "ipa": "/əbˈskjʊr/", "ex": "The reasons for the decision are still obscure to us.", "exko": "그 결정의 이유는 우리에게 아직 불분명하다."}]};
const PER = 10, KEY = 'enReview.v1';
const $ = s => document.querySelector(s);
let S = { tab:'x', ord:'seq', recall:true, star:false, page:1, stars:{x:[],v:[]}, seed:1 };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; }
function items() {
  let a = DATA[S.tab].slice();
  if (S.star) { const st = new Set(S.stars[S.tab]); a = a.filter(r => st.has(r.n)); }
  if (S.ord === 'rnd') { const r = rng(S.seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
  return a;
}
function say(t) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); } catch (e) {}
}
function card(r) {
  const on = S.stars[S.tab].includes(r.n), v = S.tab === 'v';
  const ans = v
    ? `<span class="en">${esc(r.en)}</span><span class="ipa">${esc(r.ipa)}</span><button class="say" data-say="${esc(r.en)}" aria-label="단어 듣기">🔊</button>
       <div class="ex">${esc(r.ex)} <button class="say" data-say="${esc(r.ex)}" aria-label="예문 듣기">🔊</button></div><div class="exko">${esc(r.exko)}</div>`
    : `<span class="en">${esc(r.en)}</span>
       <div class="ex">${esc(r.ex)} <button class="say" data-say="${esc(r.ex)}" aria-label="문장 듣기">🔊</button></div><div class="note">${esc(r.note)}</div>`;
  return `<div class="card${S.recall ? ' hide' : ''}" data-n="${r.n}">
    <div class="no">No.${r.n}</div><div class="ko">${esc(r.ko)}</div>
    <button class="star${on ? ' on' : ''}" aria-label="헷갈림 표시" aria-pressed="${on}">${on ? '★' : '☆'}</button>
    <div class="hint">영어를 떠올린 뒤 눌러서 확인</div><div class="ans">${ans}</div></div>`;
}
function render() {
  const a = items(), pages = Math.max(1, Math.ceil(a.length / PER));
  S.page = Math.min(Math.max(1, S.page), pages);
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === S.tab));
  document.querySelectorAll('[data-ord]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ord === S.ord));
  $('#recall').checked = S.recall; $('#starOnly').checked = S.star;
  const slice = a.slice((S.page - 1) * PER, S.page * PER);
  $('#list').innerHTML = slice.length ? slice.map(card).join('') : '<div class="empty">표시할 항목이 없습니다. (★ 표시한 항목이 없을 수 있어요)</div>';
  $('#info').textContent = `${S.tab === 'x' ? '표현' : '단어'} ${a.length}개` + (S.star ? ' · ★만' : '') + (S.ord === 'rnd' ? ' · 섞인 순서' : '');
  $('#jump').value = S.page; $('#jump').max = pages; $('#total').textContent = pages;
  $('#prev').disabled = S.page <= 1; $('#next').disabled = S.page >= pages;
  save();
}
const go = p => { S.page = p; render(); scrollTo(0, 0); };
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.page = 1; render(); });
document.querySelectorAll('[data-ord]').forEach(b => b.onclick = () => {
  if (b.dataset.ord === 'rnd') S.seed = Math.floor(Math.random() * 1e9) + 1;
  S.ord = b.dataset.ord; S.page = 1; render(); });
$('#recall').onchange = e => { S.recall = e.target.checked; render(); };
$('#starOnly').onchange = e => { S.star = e.target.checked; S.page = 1; render(); };
$('#prev').onclick = () => go(S.page - 1);
$('#next').onclick = () => go(S.page + 1);
$('#jump').onchange = e => go(parseInt(e.target.value, 10) || 1);
$('#list').onclick = e => {
  const card = e.target.closest('.card'); if (!card) return;
  const sayBtn = e.target.closest('.say');

  if (e.target.closest('.star')) {
    const n = +card.dataset.n, st = S.stars[S.tab], i = st.indexOf(n);

    if (S.star) { render(); } else { const on = i < 0, b = card.querySelector('.star');

    return;
  }
  if (S.recall) card.classList.toggle('hide');
};
render();
</script>
