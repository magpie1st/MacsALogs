<link rel="stylesheet" href="css/style.css">
<style>
.en-app { --bg:#fff; --surface:#f6f7f9; --border:#e3e5e9; --text:#1b1d21; --muted:#666b75;
  --accent:#2563eb; --accent-bg:#eaf1ff; --star:#e8a200; --mask:#e3e6ec; }
@media (prefers-color-scheme: dark) { .en-app { --bg:#101114; --surface:#181a1f; --border:#2a2d34;
  --text:#e8e9ec; --muted:#9096a1; --accent:#7aa7ff; --accent-bg:#1c2740; --star:#f5c542; --mask:#2a2e37; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body.en-app { margin:0; }
.en-app { background:var(--bg); color:var(--text); line-height:1.6; font-size:17px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
.blog .wrap { padding-left:0; padding-right:0; }
.blog .top { position:static; }
.blog .lead { margin:22px 0 6px; } .blog .lead h1 { font-size:1.5rem; margin:0; }
.blog .lead p { color:var(--muted); font-size:.9rem; margin:4px 0 0; }
.wrap { max-width:720px; margin:0 auto; padding:0 16px calc(90px + env(safe-area-inset-bottom)); }
.top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border);
  padding:10px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
button { font:inherit; color:var(--text); }
.seg button { font-size:.9rem; padding:8px 14px; border:0; background:transparent; cursor:pointer; }
.seg button + button { border-left:1px solid var(--border); }
.seg button[aria-pressed=true] { background:var(--accent); color:#fff; }
.tgl { font-size:.88rem; display:inline-flex; gap:6px; align-items:center; cursor:pointer; padding:6px 4px; }
.tgl input { width:18px; height:18px; }
.info { color:var(--muted); font-size:.82rem; margin:10px 0 2px; }
.card { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:14px 16px;
  margin:12px 0; cursor:pointer; position:relative; }
.card .no { color:var(--muted); font-size:.75rem; font-variant-numeric:tabular-nums; }
.card .ko { font-weight:600; font-size:1.05rem; padding-right:44px; }
.star { position:absolute; top:6px; right:6px; width:44px; height:44px; border:0; background:transparent;
  font-size:1.5rem; color:var(--muted); opacity:.5; cursor:pointer; }
.star.on { color:var(--star); opacity:1; }
.ans { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.card.hide .ans { display:none; }
.en { font-weight:700; color:var(--accent); background:var(--accent-bg); padding:2px 8px; border-radius:6px;
  display:inline-block; font-size:1.05rem; }
.ipa { color:var(--muted); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.9rem; margin-left:6px; }
.ex { margin-top:6px; }
.exko, .note { color:var(--muted); font-size:.88rem; margin-top:4px; }
.say { border:0; background:transparent; cursor:pointer; font-size:1rem; padding:2px 6px; opacity:.7; }
.cf { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0; } .cf[hidden] { display:none; }
.cf select { font:inherit; font-size:.88rem; color:var(--text); background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:6px 8px; max-width:100%; }
.grp { font-size:.95rem; margin:18px 0 4px; } .grp .cat { color:var(--accent); font-size:.8rem; margin-right:4px; }
.grp small { color:var(--muted); font-weight:400; }
.lit { color:var(--muted); font-size:.85rem; margin-top:4px; }
.clip { border:1px solid var(--line, #ccc); border-radius:6px; background:transparent; cursor:pointer; font-size:.8rem; padding:2px 8px; margin-left:4px; }
.src { color:var(--muted); font-size:.78rem; margin-top:4px; }
.src a { color:inherit; }
.hint { color:var(--muted); font-size:.82rem; margin-top:8px; }
.card:not(.hide) .hint { display:none; }
.pager { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--border);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom)); }
.pager > div { max-width:720px; margin:0 auto; display:flex; gap:8px; align-items:center; justify-content:space-between; }
.pager button { min-width:76px; min-height:46px; padding:0 14px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); font-size:.95rem; cursor:pointer; }
.pager button:disabled { opacity:.35; }
.pager .pos { color:var(--muted); font-size:.9rem; text-align:center; flex:1; }
.pager .pos input { width:3.2em; font:inherit; text-align:center; border:1px solid var(--border); border-radius:6px;
  background:var(--surface); color:var(--text); padding:4px 0; }
.empty { color:var(--muted); text-align:center; padding:40px 0; }
</style>

<div class="lead"><h1>영어 복습</h1>

<script>
const DATA = {"x": [{"n": 1, "ko": "아직 크게 실감이 안 나요.", "en": "really hit me", "ex": "It hasn't really hit me yet.", "note": "2026-07-05. 어떤 일이 실제로 일어났지만 감정적으로 아직 와닿지 않을 때."}, {"n": 2, "ko": "나는 완전히 끊기로 했어요.", "en": "quit cold turkey", "ex": "I decided to quit cold turkey.", "note": "2026-07-05. 담배/술/습관 등을 단번에 끊는다는 뜻."}, {"n": 3, "ko": "아까부터 배에서 꼬르륵 소리가 나요.", "en": "stomach has been growling", "ex": "My stomach has been growling for a while now.", "note": "2026-07-05. 원문 `grawling`→`growling`."}, {"n": 4, "ko": "쉴 틈이 거의 없어요.", "en": "barely get a moment to rest", "ex": "I barely get a moment to rest.", "note": "2026-07-05. \"...할 짬이 거의 없다\"는 구어체 패턴."}, {"n": 5, "ko": "저는 반드시 예습도 하고 쓰기 연습도 해요.", "en": "make sure to", "ex": "I make sure to preview the lesson and practice writing as well.", "note": "2026-07-20. 루틴·습관을 말할 때 재사용하기 좋음."}, {"n": 6, "ko": "저는 더 많은 아웃풋 연습이 필요하다고 느꼈어요.", "en": "needed more output", "ex": "I felt like I needed more output.", "note": "2026-07-20. 학습 방향 전환을 설명할 때 좋음."}, {"n": 7, "ko": "요즘은 AI가 제 글을 즉시 확인해줘서 동기 유지에 도움이 돼요.", "en": "stay motivated", "ex": "AI can instantly check my writing these days, which has helped me stay motivated.", "note": "2026-07-20. 원문 `which is helped`→`which has helped`."}, {"n": 8, "ko": "그래서 그냥 틀린 부분을 지우고 계속해요.", "en": "cross things out and keep going", "ex": "So I just cross things out and keep going.", "note": "2026-07-20. 실수를 학습 과정으로 받아들이는 표현."}, {"n": 9, "ko": "우리가 결혼한 지 13년이 됐어요.", "en": "tied the knot", "ex": "It has been 13 years since we tied the knot.", "note": "2026-07-21. 결혼 시점을 말할 때 바로 쓸 수 있는 표현."}, {"n": 10, "ko": "그는 장기 계획을 좋아하지만, 저는 하루하루를 즐기는 데 더 집중해요.", "en": "enjoying each day as it comes", "ex": "He likes making long-term plans, while I focus more on enjoying each day as it comes.", "note": "2026-07-21. 성향 차이를 부드럽게 비교하는 문장."}, {"n": 11, "ko": "우리는 가족 전체에 영향을 주는 장기적 문제엔 보통 의견이 잘 맞아요.", "en": "see eye to eye", "ex": "We usually see eye to eye when it comes to long-term issues that affect the whole family.", "note": "2026-07-21. `when it comes to`와 함께 쓰기 좋음."}, {"n": 12, "ko": "바로 그래서 우리는 서로 균형을 맞춰줘요.", "en": "balance each other out", "ex": "That is exactly why we balance each other out.", "note": "2026-07-21. 서로 다른 성향이 장점이 되는 상황."}, {"n": 13, "ko": "저는 일과 병행하면서 꾸준히 공부하려고 노력해 왔어요.", "en": "while balancing work", "ex": "I have been trying to study consistently while balancing work.", "note": "2026-07-22. 원문 `well balancing work`→`while balancing work`."}, {"n": 14, "ko": "매일 영어에 노출되는 것만으로도 더 빠져들고 자신감이 올라갔어요.", "en": "being exposed to English every day", "ex": "Just being exposed to English every day has helped me get into it more and boosted my confidence.", "note": "2026-07-22. `everyday`→`every day`, `booted`→`boosted`."}, {"n": 15, "ko": "그게 제가 계속 공부할 동기를 유지하게 해줘요.", "en": "keeps me motivated", "ex": "That's what keeps me motivated to keep studying.", "note": "2026-07-22. 루틴 유지 이유를 말할 때 좋은 문장."}, {"n": 16, "ko": "흥미로운 아이디어가 떠오를 때마다 계속 글을 쓰고 공유할 계획이에요.", "en": "comes to mind", "ex": "Whenever an interesting idea comes to mind, I plan to keep writing and sharing my stories.", "note": "2026-07-22. 아이디어 기록·글쓰기 루틴과 연결하기 좋음."}, {"n": 17, "ko": "증상이 전혀 없어서 건강검진이 아니었다면 발견 못했을 거예요.", "en": "if it hadn't been for", "ex": "I didn't have any symptoms, so if it hadn't been for the health screening, I probably never would've found it.", "note": "2026-07-23. 건강검진의 중요성을 말하는 가정법 문장."}, {"n": 18, "ko": "건강은 당연하게 여길 것이 아니라는 걸 깨달았어요.", "en": "take for granted", "ex": "It reminded me that health is not something we should take for granted.", "note": "2026-07-23. 교훈·깨달음을 말할 때 재사용 가능."}, {"n": 19, "ko": "모두 정기 검진을 꾸준히 받고 건강하길 바라요.", "en": "keep up with regular checkups", "ex": "I hope everyone keeps up with regular checkups and stays healthy.", "note": "2026-07-23. 마무리 권유 문장."}, {"n": 20, "ko": "곧 땀이 엄청나게 났다.", "en": "sweating buckets", "ex": "I was soon sweating buckets.", "note": "레거시 원본 No.138."}, {"n": 21, "ko": "너무 힘들어 주저앉고 말았다.", "en": "sank to the ground exhausted", "ex": "I san ˈbʊkt/", "ex": "Our engineers are overbooked until the end of the year.", "exko": "우리 엔지니어들은 연말까지 일정이 초과 배정돼 있다."}, {"n": 167, "ko": "연기하다", "en": "postpone", "ipa": "/poʊˈspoʊn/", "ex": "They decided to postpone the workshop by two weeks.", "exko": "그들은 워크숍을 2주 미루기로 했다."}, {"n": 168, "ko": "예비의, 사전의", "en": "preliminary", "ipa": "/prɪˈlɪmɪneri/", "ex": "This is only a preliminary result, so please don't share it yet.", "exko": "이것은 예비 결과일 뿐이니 아직 공유하지 마세요."}, {"n": 169, "ko": "통합하다, 하나로 합치다", "en": "consolidate", "ipa": "/kənˈsɑːlɪdeɪt/", "ex": "We consolidated three separate documents into one.", "exko": "우리는 따로 있던 문서 세 개를 하나로 통합했다."}, {"n": 170, "ko": "임시의, 잠정의", "en": "interim", "ipa": "/ˈɪntərɪm/", "ex": "She was appointed interim manager until a permanent leader is hired.", "exko": "정식 리더가 채용될 때까지 그녀가 임시 매니저로 임명됐다."}, {"n": 171, "ko": "설득력 있는", "en": "compelling", "ipa": "/kəmˈpelɪŋ/", "ex": "The demo needs a compelling use case to win over the executives.", "exko": "그 데모에는 경영진을 설득할 만한 사용 사례가 필요하다."}, {"n": 172, "ko": "조율자, 오케스트레이터", "en": "orchestrator", "ipa": "/ˈɔːrkɪstreɪtər/", "ex": "The orchestrator decides which agent should handle each request.", "exko": "오케스트레이터가 각 요청을 어느 에이전트가 처리할지 정한다."}, {"n": 173, "ko": "선제적인, 능동적인", "en": "proactive", "ipa": "/proʊˈæktɪv/", "ex": "A good assistant is proactive, not just reactive.", "exko": "좋은 비서는 반응만 하지 않고 선제적이다."}, {"n": 174, "ko": "거슬리게 끼어드는", "en": "intrusive", "ipa": "/ɪnˈtruːsɪv/", "ex": "Frequent pop-up alerts can feel intrusive while driving.", "exko": "운전 중 잦은 팝업 알림은 거슬리게 느껴질 수 있다."}, {"n": 175, "ko": "공감하는", "en": "empathetic", "ipa": "/ˌempəˈθetɪk/", "ex": "We want the avatar to sound more empathetic.", "exko": "우리는 아바타가 더 공감하는 것처럼 들리게 하고 싶다."}, {"n": 176, "ko": "모듈식의", "en": "modular", "ipa": "/ˈmɑːdʒələr/", "ex": "A modular design lets us swap one partner for another.", "exko": "모듈식 설계 덕분에 파트너를 다른 곳으로 바꿀 수 있다."}, {"n": 177, "ko": "굼뜬, 느릿한", "en": "sluggish", "ipa": "/ˈslʌɡɪʃ/", "ex": "My laptop gets sluggish whenever it installs updates.", "exko": "내 노트북은 업데이트를 설치할 때마다 굼떠진다."}, {"n": 178, "ko": "규정 준수", "en": "compliance", "ipa": "/kəmˈplaɪəns/", "ex": "Changing the kernel could break our compliance with Google's rules.", "exko": "커널을 바꾸면 구글 규정 준수에 어긋날 수 있다."}, {"n": 179, "ko": "논란이 많은", "en": "controversial", "ipa": "/ˌkɑːntrəˈvɜːrʃəl/", "ex": "Calling it a space rather than a product is a bit controversial.", "exko": "제품이 아니라 영역이라 부르는 것은 약간 논란의 여지가 있다."}, {"n": 180, "ko": "의존성, 의존 관계", "en": "dependency", "ipa": "/dɪˈpendənsi/", "ex": "The schedule has a heavy dependency on the supplier.", "exko": "일정은 공급업체에 크게 의존한다."}, {"n": 181, "ko": "멈추다; 지연시키다", "en": "stall", "ipa": "/stɔːl/", "ex": "Don't stall the project while waiting for approval.", "exko": "승인을 기다리며 프로젝트를 멈춰 세우지 마세요."}, {"n": 182, "ko": "지연 시간", "en": "latency", "ipa": "/ˈleɪtənsi/", "ex": "Parking commands need very low latency.", "exko": "주차 명령은 지연 시간이 아주 짧아야 한다."}, {"n": 183, "ko": "발화, 한 번 하는 말", "en": "utterance", "ipa": "/ˈʌtərəns/", "ex": "The system handles each user utterance in under a second.", "exko": "시스템은 사용자의 발화를 하나당 1초 안에 처리한다."}, {"n": 184, "ko": "확장 가능한", "en": "scalable", "ipa": "/ˈskeɪləbl/", "ex": "We need a scalable architecture that can serve millions of users.", "exko": "수백만 사용자를 감당할 수 있는 확장 가능한 구조가 필요하다."}, {"n": 185, "ko": "실행 가능한, 사업성 있는", "en": "viable", "ipa": "/ˈvaɪəbl/", "ex": "Is this a commercially viable product?", "exko": "이것이 사업성이 있는 제품인가?"}, {"n": 186, "ko": "엄두를 못 낼 만큼 높은", "en": "prohibitive", "ipa": "/proʊˈhɪbɪtɪv/", "ex": "The cost of running a large model for every user is prohibitive.", "exko": "모든 사용자에게 큰 모델을 돌리는 비용은 엄두를 못 낼 만큼 높다."}, {"n": 187, "ko": "증류하다; 핵심만 추려 작게 만들다", "en": "distill", "ipa": "/dɪˈstɪl/", "ex": "They want to distill a large model into a smaller one.", "exko": "그들은 큰 모델을 작은 모델로 증류하고 싶어 한다."}, {"n": 188, "ko": "실현 가능성", "en": "feasibility", "ipa": "/ˌfiːzəˈbɪləti/", "ex": "We ran a quick feasibility study before starting the PoC.", "exk 깨, 그리고 아들의 전화 · 2026-11-07", "ex": "So just mix in some Korean.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 56.92, "end": 58.61}, "nb": false}, {"n": 14, "id": "e6c180f5ff9", "en": "Let's eat this much for now", "ko": "일단 여기까지 먹어 보고", "note": "'일단'은 대부분 for now 나 let's just 로 풀린다. 순서를 말할 때만 first.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "일본어 맥주 놀이와 '일단'", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "That's not the one I mean. I mean like, 'Let's eat this much for now, and then decide if we want more.'", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 66.68, "end": 74.1}, "nb": false}, {"n": 15, "id": "e30d1951bc6", "en": "Shall we have a beer?", "ko": "맥주 한잔할까?", "note": "Shall we ~? 는 같이 하자고 권하는 말. 가볍게는 Want to grab a beer?", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "일본어 맥주 놀이와 '일단'", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Well, you don't eat beer, you drink it. So you'd say 'Biru o nomimashou ka?' It means, 'Shall we have a beer?'", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 22.8, "end": 32.12}, "nb": false}, {"n": 16, "id": "e426243bf6c", "en": "That's a tough one.", "ko": "어렵네", "note": "질문이 어려울 때 It's difficult 보다 훨씬 자연스럽다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "일본어 맥주 놀이와 '일단'", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Okay, but how do you say '일단' in English? That's a tough one.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 59.11, "end": 63.99}, "nb": false}, {"n": 17, "id": "ef784721ca6", "en": "Every breed has its weak spot.", "ko": "강아지마다 고질병이 있어", "note": "weak spot — 타고난 약한 곳. 병명을 몰라도 쓸 수 있다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "쌉쌀한 샐러드와 산책길 강아지 친구들", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Right, their backs are way too long for their legs. Every breed has its weak spot, and for dachshunds, it's their discs.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 166.61, "end": 176.29}, "nb": false}, {"n": 18, "id": "e9fe6daf26a", "en": "it felt like it was overtreating", "ko": "과잉진료 같아서", "note": "overtreat · push unnecessary procedures. 병원 이야기에서 자주 쓴다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "쌉쌀한 샐러드와 산책길 강아지 친구들", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "You know I used to go to two vet clinics. The other one felt like it was overtreating, so I stopped going. A puppy who went there had kneecap surgery just six months after they brought him home.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 210.56, "end": 225.5}, "nb": false}, {"n": 19, "id": "edbade47df2", "en": "The name suits him perfectly.", "ko": "이름이랑 너무 찰떡이야", "note": "찰떡 = suits ~ perfectly / is a perfect fit.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "쌉쌀한 샐러드와 산책길 강아지 친구들", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Just some dog from the neighborhood. I'm usually terrible with dog names, but he looks exactly like a Bamtori, a little chestnut. The name suits him perfectly, so I remember him.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 115.1, "end": 128.21}, "nb": false}, {"n": 20, "id": "ea0f5953947", "en": "way more bitter than I expected", "ko": "생각보다 너무 쓰다", "note": "way more — 생각보다 훨씬. than I expected 를 붙이면 놀람이 산다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "쌉쌀한 샐러드와 산책길 강아지 친구들", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Whoa, this is way more bitter than I expected. What is this, red leaf lettuce?", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 96.81, "end": 103.03}, "nb": false}, {"n": 21, "id": "e3eae87c3c0", "en": "We run into them now and then.", "ko": "가끔 만나", "note": "run into — 약속 없이 우연히 마주치다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "쌉쌀한 샐러드와 산책길 강아지 친구들", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "We run into them now and then. Ongsimi and Bamtori.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 128.71, "end": 133.15}, "nb": false}, {"n": 22, "id": "ee121070315", "en": "You really have to do your homework.", "ko": "잘 알아봐야 돼", "note": "do your homework — 결정 전에 충분히 알아보다. 숙제가 아니다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "쌉쌀한 샐러드와 산책길 강아지 친구들", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Good thing they didn't. You really have to do your homework.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 231.35, "end": 235.32}, "nb": false}, {"n": 23, "id": "e7e44e037c5", "en": "hold off on it for a while", "ko": "당분간 하지 마세요", "note": "hold off on ~ — 잠시 미루다 · 쉬다. stop 보다 '나중엔 해도 된다' 는 느낌.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "어깨 수술, 그 뒤 일 년", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Exactly. She meant pulling. But she said to hold off on push-ups and swimming for a while. Push-ups are the worst thing for your shoulder.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 393.57, "end": 403.03}, "nb": false}, {"n": 24, "id": "e9035f1aa24", "en": "I wonder if you should've skipped the surgery.", "ko": "수술 안 할 걸 그랬나 싶어", "note": "should've arm would just give out on the pull.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 431.8, "end": 442.25}, "nb": false}, {"n": 28, "id": "e2ba8d4ff5a", "en": "The whole point of the surgery was so I could swim", "ko": "수영하려고 한 수술인데", "note": "The whole point of ~ was … — '애초에 ~하려고 한 건데' 의 틀.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "어깨 수술, 그 뒤 일 년", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Back then it only hurt when I did this motion. The whole point of the surgery was so I could swim, and now I can't swim at all.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 247.37, "end": 256.53}, "nb": false}, {"n": 29, "id": "eb960438497", "en": "it shouldn't put much strain on your shoulder", "ko": "어깨에 부담이 없어야 돼", "note": "put strain on ~ — ~에 무리를 주다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "자유형 강의 — 하이 엘보와 땅콩", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "If you use your shoulder blades properly, it shouldn't put much strain on your shoulder. Especially when you catch the water, you keep your elbow high. They call it a high elbow catch.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 489.44, "end": 502.59}, "nb": false}, {"n": 30, "id": "e9113152713", "en": "it's a total mess", "ko": "난리가 나", "note": "a total mess · a disaster. 웃으며 과장할 때.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "자유형 강의 — 하이 엘보와 땅콩", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "The really good swimmers put the float around their ankles. When a beginner tries that, it's a total mess. Your legs tense up and it's exhausting.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 553.86, "end": 564.79}, "nb": false}, {"n": 31, "id": "e2da24a32e4", "en": "My body keeps sinking.", "ko": "몸이 자꾸 가라앉아", "note": "keep ~ing — 자꾸 ~하다. 짜증 섞인 반복에 잘 맞는다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "자유형 강의 — 하이 엘보와 땅콩", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "I'm doing one-arm drills on purpose to fix that, but it's so hard. My body keeps sinking.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 530.59, "end": 538.02}, "nb": false}, {"n": 32, "id": "ea466a380c1", "en": "stick to freestyle", "ko": "자유형만 해", "note": "stick to ~ — 다른 건 말고 그것만 하다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "자유형 강의 — 하이 엘보와 땅콩", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Usually, when someone hurts their shoulder, they say if swimming's okay at all, stick to freestyle. Never do butterfly.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 464.89, "end": 473.57}, "nb": false}, {"n": 33, "id": "e98c2e844cf", "en": "you end up holding your breath", "ko": "숨을 참게 돼", "note": "end up ~ing — 의도와 달리 결국 ~하게 되다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "자유형 강의 — 하이 엘보와 땅콩", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "I only used this arm, with the float between my legs. When you swim with one arm, you lose your balance, so you end up holding your breath like a total beginner.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 517.86, "end": 530.09}, "nb": false}, {"n": 34, "id": "eefc2c4143f", "en": "by the lunar calendar", "ko": "음력으로 하면", "note": "양력은 the solar calendar 이지만 대화에서는 the regular calendar 가 더 잘 통한다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "벌써 쉰, 그리고 음력 생일", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "By the lunar calendar, it's three years. By the regular calendar, it's two. And her ID card has a different year altogether.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 598.08, "end": 607.85}, "nb": false}, {"n": 35, "id": "e644f021f5a", "en": "He's five years older than me.", "ko": "다섯 살 차이", "note": "'~살 차이' 는 older / younger 로 방향을 넣어 말한다. 5 years difference 는 어색하다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "벌써 쉰, 그리고 음력 생일", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "And your brother's five years older than you, right?", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 587.4, "end": 590.16}, "nb": false}, {"n": 36, "id": "e0d932587f3", "en": "her birthday makes it tricky", "ko": "생일이 애매해서", "note": "tricky — 딱 잘라 말하기 어려운. 애매하다의 좋은 대응어.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "벌써 쉰, 그리고 음력 생일", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Five years. And my sister's three years younger. Or two. Her birthday makes it tricky.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 590.66, "end": 597.58}, "nb": false}, {"n": 37, "id": "e31e6c778e6", "en": "I'm already fifty.", "ko": "벌써 쉰이 돼 버렸어", "note": "already 하나로 '벌써' 의 서운함이 산다. Where did the time go? 를 덧붙여도 좋다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "벌써 쉰, 그리고 음력 생일", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "I used to think forty didn't suit me, and now that's long gone. I'm already fifty.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 580.1, "end": 586.9}, "nb": false}, {"n": 38, "id": "e60d25207e7", "en": "He needs to step up his game.", "ko": "아들도 꾸며야 돼", "note": "step up one's game — 수준을 끌어올리다. '꾸미다' 를 decorate 로 옮기면 안 된다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "다정함, 능력, 그리고 외모", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "These days, even with money, if your looks are really bad, nobody picks you. Looks are a real competitive edge now. Our son needs to step up his game too.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 712.29, "end": 724.47}, "nb": false}, {"n": 39, "id": "e9743344ead", "en": "it doesn't put food on the table", "ko": "배고픔은 해결 못 해", "note": "put food on the table — 먹고살게 해 주다. 생계를 말하는 관용구.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "다정함, 능력, 그리고 외모", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Sure, it fixes a lot. But it doesn't put food on the table.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 634.04, "end": 638.55}, "nb": false}, {"n": 40, "id": "eed5bffcd0a", "en": "Kindness fixes a lot of things.", "ko": "다정한 게 많은 걸 해결해 줘", "note": "solve 보다 fix 가 일상적이다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "다정함, 능력, 그리고 외모", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "I really think kindness fixes a lot of things.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 629.94, "end": 633.54}, "nb": false}, {"n": 41, "id": "ee1155c338d", "en": "Looks are a real competitive edge.", "ko": "외모도 경쟁력이야", "note": "competitive edge — 남보다 앞서게 하는 강점.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "다정함, 능력, 그리고 외모", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "These days, even with money, if your looks are really bad, nobody picks you. Looks are a real competitive edge now. Our son needs to step up his game too.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 712.29, "end": 724.47}, "nb": false}, {"n": 42, "id": "eb1cb632cc6", "en": "looks become the tiebreaker", "ko": "외모로 갈리는 거지", "note": "tiebreaker — 동점일 때 승부를 가르는 것. 조건이 같을 때 마지막 기준.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "다정함, 능력, 그리고 외모", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "That's a little different, though. That's inside the show. The people on it are already screened. They all have decent jobs and some money. Once that's a given, looks become the tiebreaker.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 680.78, "end": 693.74}, "nb": false}, {"n": 43, "id": "ed779d37aeb", "en": "Say option one is … Which one would you pick?", "ko": "1번이라면 어느 쪽을 택하겠어?", "note": "Say ~ 로 가정을 깔고 묻는다. If 보다 가볍다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "다정함, 능력, 그리고 외모", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Okay, say option one is someone who isn't kind, but has money and is really capable. Which one would you pick?", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 639.05, "end": 647.71}, "nb": false}, {"n": 44, "id": "e1656757907", "en": "Can we expect good things?", "ko": "기대해도 되는 거야?", "note": "expect 에 good things 를 붙여야 '기대' 가 된다. expect 만 쓰면 '예상' 에 가깝다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "아들과의 통화 — 젤다, 카메라, 장학금", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "But can we expect good things from your midterms?", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 894.03, "end": 897.28}, "nb": false}, {"n": 45, "id": "ebfada5660a", "en": "Guess he's not short on pocket money.", "ko": "용돈이 궁하지 않은가 봐", "note": "be short on ~ — ~이 모자라다. Guess 로 시작하면 '~인가 봐'.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "아들과의 통화 — 젤다, 카메라, 장학금", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Guess he's not short on pocket money.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 775.85, "end": 778.08}, "nb": false}, {"n": 46, "id": "e110f70db3f", "en": "He'll have to pick up some shifts.", "ko": "알바 뛰어야지", "note": "pick up shifts — 근무를 더 잡다. 알바는 a part-time job · side gig.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "아들과의 통화 — 젤다, 카메라, 장학금", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Then he'll have to pick up some warehouse shifts.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 928.33, "end": 931.21}, "nb": false}, {"n": 47, "id": "e45098335cc", "en": "I go out and shoot when I need to clear my head.", "ko": "답답할 때 나가서 찍어", "note": "clear one's head — 머리를 식히다. 답답하다를 frustrated 로 옮기면 뜻이 달라진다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "아들과의 통화 — 젤다, 카메라, 장학금", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Not during exams. But when it's not exam season, I go out and shoot when I need to clear my head.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 857.16, "end": 863.59}, "nb": false}, {"n": 48, "id": "e0544ebe1e4", "en": "I pre-ordered it.", "ko": "예약 구매로 샀어", "note": "pre-order — 출시 전 예약 구매. 동사로 그대로 쓴다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "아들과의 통화 — 젤다, 카메라, 장학금", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Yeah, I pre-ordered it.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 807.12, "end": 808.84}, "nb": false}, {"n": 49, "id": "e652c357b6a", "en": "On that tiny paycheck, you still manage to do it all.", "ko": "그 박봉에도 할 건 다 하네", "note": "manage to ~ — 어떻게든 해내다. 칭찬 반 놀림 반.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "아들과의 통화 — 젤다, 카메라, 장학금", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Oh, you pre-ordered it? Look at you. On that tiny paycheck, and you still manage to do it all.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 809.34, "end": 816.69}, "nb": false}, {"n": 50, "id": "e53848e0b81", "en": "Should we just have him ask when he needs it?", "ko": "그때그때 타 쓰라고 할까?", "note": "have + 사람 + 동사원형 — ~하게 하다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "아들과의 통화 — 젤다, 카메라, 장학금", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "Of course we do. Why wouldn't we? Not counting rent, maybe five hundred thousand won? Or should we just have him ask when he needs it?", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 784.32, "end": 795.0}, "nb": false}, {"n": 51, "id": "e337a806362", "en": "I have like five or six and I'm done.", "ko": "대여섯 개 딱 먹고 안 먹어", "note": "I'm done — 그만 먹는다 · 끝. 간결하게 끊는 말.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", "sc": "품절된 너구리맛 양파링", "src": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화 · 2026-11-07", "ex": "These days, even with corn chips, I have like five or six and I'm done.", "a": {"src": "audio/comm/2026-11-07-dinner-table.mp3", "start": 974.95, "end": 980.86}, "nb": false}, {"n": 52, "id": "e0075c74afe", "en": "Sold out at every department store.", "ko": "백화점은 다 품절이야", "note": "주어 없이 Sold out 으로 시작해도 대화에서는 자연스럽다.", "count": 1, "cat": "일상대화", "ep": "2026-11-07-dinner-table", "ept": "저녁 식탁에서 — '일단', 어깨, 그리고 아들의 전화", "date": "2026-11-07", const PER = 10, KEY = 'enReview.v1';

(() => { const m = location.hash.match(/^#c(?::(.+))?$/); if (m && DATA.c) { S.tab = 'c'; S.page = 1;

}

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; }
function items() {
  let a = DATA[S.tab].slice();
  if (S.tab === 'c') { if (S.cat) a = a.filter(r => r.cat === S.cat); if (S.ep) a = a.filter(r => r.ep === S.ep); }
  if (S.star) { const st = new Set(S.stars[S.tab]); a = a.filter(r => st.has(r.n)); }
  if (S.ord === 'rnd') { const r = rng(S.seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

}
function card(r) {
  const on = S.stars[S.tab].includes(r.n), v = S.tab === 'v', c = S.tab === 'c';
  const ans = c
    ? `<span class="en">${esc(r.en)}</span> <button class="say" data-say="${esc(r.en)}" aria-label="표현 듣기">🔊</button>

       ${r.ex ? `<div class="ex">${esc(r.ex)}</div>` : ''}${r.lit ? `<div class="lit">직역하면 <s>${esc(r.lit)}</s></div>` : ''}<div class="note">${esc(r.note)}</div>
       <div class="src"><a href="comm.html#${esc(r.ep)}">${esc(r.src)}</a>${r.count > 1 ? ` · ${r.count}회 나옴` : ''}${r.nb ? ' · 내 노트에 있음' : ''}</div>`

    ? `<span class="en">${esc(r.en)}</span><span class="ipa">${esc(r.ipa)}</span><button class="say" data-say="${esc(r.en)}" aria-label="단어 듣기">🔊</button>

       <div class="ex">${esc(r.ex)} <button class="say" data-say="${esc(r.ex)}" aria-label="문장 듣기">🔊</button></div><div class="note">${esc(r.note)}</div>`;

function render() {
  const a = items(), pages = Math.max(1, Math.ceil(a.length / PER));

  const slice = a.slice((S.page - 1) * PER, S.page * PER);

  let last = '';   // 순서대로 볼 때는 출처 · 대화가 바뀌는 자리에 제목을 단다
  const head = r => { if (S.tab !== 'c' || S.ord !== 'seq') return ''; const k = r.cat + '|' + r.ep; if (k === last) return '';

  $('#list').innerHTML = slice.length ? slice.map(r => head(r) + card(r)).join('') : '<div class="empty">표시할 항목이 없습니다. (★ 표시한 항목이 없을 수 있어요)</div>';
  $('#info').textContent = `${S.tab === 'x' ? '표현' : S.tab === 'c' ? '대화 표현' : '단어'} ${a.length}개` + (S.star ? ' · ★만' : '') + (S.ord === 'rnd' ? ' · 섞인 순서' : '');
  if (S.tab === 'c' && S.stars.c.length) {   // ★ 를 노트로 올리는 명령 — 정적 페이지라 서버로 보낼 수 없다(D3 · D4)

  const eps = []; DATA.c.forEach(r => { if ((!S.cat || r.cat === S.cat) && !eps.some(e => e.ep === r.ep)) eps.push(r); });
  $('#cfEp').innerHTML = `<option value="">모든 대화 (${eps.length})</option>` +
    eps.map(e => `<option value="${esc(e.ep)}"${e.ep === S.ep ? ' selected' : ''}>${esc(e.date)} ${esc(e.ept)} (${DATA.c.filter(r => r.ep === e.ep).length})</option>`).join('');
}
$('#cfCat').onchange = e => { S.cat = e.target.value; S.ep = ''; S.page = 1; render(); };
$('#cfEp').onchange = e => { S.ep = e.target.value; S.page = 1; render(); };
const go = p => { S.page = p; render(); scrollTo(0, 0); };
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.page = 1; render(); });
document.querySelectorAll('[data-ord]').forEach(b => b.onclick = () => {
  if (b.dataset.ord === 'rnd') S.seed = Math.floor(Math.random() * 1e9) + 1;

$('#recall').onchange = e => { S.recall = e.target.checked; render(); };
$('#starOnly').onchange = e => { S.star = e.target.checked; S.page = 1; render(); };
$('#prev').onclick = () => go(S.page - 1);

  const card = e.target.closest('.card'); if (!card) return;
