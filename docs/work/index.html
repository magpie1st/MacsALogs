  <script>
  (function () {
    function get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
    function n(o) { return o && typeof o === 'object' ? Object.keys(o).length : 0; }
    function mine() {   // 이 브라우저의 진척(어디에도 보내지 않는다)
      var en = get('enReview.v1'), st = en && en.stars ? en.stars : {};
      var stars = (st.x || []).length + (st.v || []).length + (st.c || []).length;
      var m = {
        review: stars ? '★ ' + stars + '개 표시' : '',
        talk: n(get('comm-review')) ? '복습 카드 ' + n(get('comm-review')) + '개' : '',
        drama: n(get('tvshow-pos')) ? '이어듣기 ' + n(get('tvshow-pos')) + '회차' : '',
        audiobook: n(get('audiobook-pos')) ? '이어듣기 ' + n(get('audiobook-pos')) + '곳' : ''
      };
      Object.keys(m).forEach(function (k) {
        var el = document.querySelector('[data-mine="' + k + '"]');
        if (el) el.textContent = m[k];
      });
    }
    var box = document.getElementById('ls-key').textContent.trim();
    if (!box) return;
    LS.unlock(document.getElementById('hub-lock'), function (pw) { return LS.decrypt(box, pw); },
              { lead: 'Work 암호를 넣으면 아래에 페이지 카드가 열린다. 이 기기에 기억해 두면 다시 묻지 않는다.' })
      .then(function (cards) {
        document.getElementById('hub-cards').innerHTML = cards;
        mine();
        document.getElementById('hub-status').hidden = false;
        document.getElementById('hub-status-text').textContent = '이 기기에서는 ' + LS.title + ' 페이지가 바로 열린다.';
        LS.forgetButton(document.getElementById('hub-forget'));
      });
  })();
  </script>
