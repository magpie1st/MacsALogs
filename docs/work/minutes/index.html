  <script>
LS.sealedList(function (plain) {
  var body = document.getElementById('ls-body');
  body.innerHTML = plain;
  var btns = body.querySelectorAll('.ls-seg button'), cards = body.querySelectorAll('.mom-card'), count = body.querySelector('.mom-count');
  if (!btns.length) return;
  var kinds = Array.prototype.map.call(btns, function (b) { return b.dataset.kind; });
  function show(k) {
    btns.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.kind === k ? 'true' : 'false'); });
    var n = 0;
    cards.forEach(function (c) {
      var on = c.dataset.kind === k;
      c.style.display = on ? '' : 'none'; if (on) n++;   // .mom-card 의 display:block 이 hidden 을 이긴다
    });
    count.textContent = n + '건';
    history.replaceState(null, '', k === kinds[0] ? location.pathname : '#' + k);
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.kind); }); });
  var h = location.hash.slice(1);
  show(kinds.indexOf(h) >= 0 ? h : kinds[0]);
});
</script>
